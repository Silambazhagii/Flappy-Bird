<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="gameover">
    <div class="container">
        <div class="gameoverlogo"><img src="/gameover.png" width="270px"></div>
        <div class="phrases"></div>

            <span id="user-name"></span> You Scored: <span id="overallScore"></span>

        <div class="return">
            <div class="play_again button">PLAY AGAIN</div>
            <div class="home button">HOME</div>
        </div>
    </div>
    <script src="gameover.js"></script>
</body>

</html>
